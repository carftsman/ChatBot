spring.application.name=API_Gateway
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JWT secret — must match chatbot-service exactly
jwt.secret=chatbot-super-secret-key-minimum-32-characters-long

# Route 1 — Login (PUBLIC — no filter)
spring.cloud.gateway.routes[0].id=auth-login
#spring.cloud.gateway.routes[0].uri=lb://CHATBOT_SERVICE
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login

# Route 2 — Logout (PUBLIC — no filter)
spring.cloud.gateway.routes[1].id=auth-logout
#spring.cloud.gateway.routes[1].uri=lb://CHATBOT_SERVICE
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/logout

# Route 3 — Chat APIs (PROTECTED — JWT filter applied)
spring.cloud.gateway.routes[2].id=chatbot-api
#spring.cloud.gateway.routes[2].uri=lb://CHATBOT_SERVICE
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[2].filters[0]=AuthFilter

# Route 4 — Swagger (PUBLIC — for frontend/testing)
spring.cloud.gateway.routes[3].id=swagger
#spring.cloud.gateway.routes[3].uri=lb://CHATBOT_SERVICE
spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/swagger-ui/**,/v3/api-docs/**