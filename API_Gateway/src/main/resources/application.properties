spring.application.name=API_Gateway
server.port=8081

# Eureka — local
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=https://serviceregistry-9y5o.onrender.com/eureka


# JWT secret — must match chatbot-service exactly
jwt.secret=chatbot-super-secret-key-minimum-32-characters-long

# ─────────────────────────────────────────────
# Route 0 — Login (PUBLIC — no filter)
# ─────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=auth-login
#spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].uri=https://chatbot-service-eb2k.onrender.com
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login

# ─────────────────────────────────────────────
# Route 1 — Logout (PUBLIC — no filter)
# ─────────────────────────────────────────────
spring.cloud.gateway.routes[1].id=auth-logout
#spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].uri=https://chatbot-service-eb2k.onrender.com
#spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/logout

# ─────────────────────────────────────────────
# Route 2 — Swagger UI (PUBLIC — no filter)
# ─────────────────────────────────────────────
spring.cloud.gateway.routes[2].id=swagger-ui
#spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].uri=https://chatbot-service-eb2k.onrender.com
spring.cloud.gateway.routes[2].predicates[0]=Path=/swagger-ui/**

# ─────────────────────────────────────────────
# Route 3 — API Docs (PUBLIC — no filter)
# ─────────────────────────────────────────────
spring.cloud.gateway.routes[3].id=api-docs
#spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].uri=https://chatbot-service-eb2k.onrender.com
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/**

# ─────────────────────────────────────────────
# Route 4 — ALL Chat + API endpoints (JWT filter)
# This covers /api/chat/start, /api/chat/message etc.
# ─────────────────────────────────────────────
spring.cloud.gateway.routes[4].id=chatbot-api
#spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].uri=https://chatbot-service-eb2k.onrender.com
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[4].filters[0]=AuthFilter